[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civilian-water-monitor"
version = "0.4.0"
description = "Local civilian environmental sensor simulation and survey recording"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
water-monitor = "water_monitor.server:main"

[tool.setuptools.packages.find]
include = ["water_monitor*"]

[tool.setuptools.package-data]
water_monitor = ["static/*.html", "static/*.js", "static/*.css"]
