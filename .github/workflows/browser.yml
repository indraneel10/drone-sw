name: Dashboard acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser_smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-browser-results
          path: browser-results/
          if-no-files-found: ignore
          retention-days: 7
